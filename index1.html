<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little Space 🩵</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(160deg, #bdeeff, #dff8ff, #aee5ff);
            color: #3d6680;
            overflow-x: hidden;
        }

        /* Background decoration */
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            filter: blur(1px);
            z-index: -1;
            animation: float 5s ease-in-out infinite;
        }

        .bubble.one {
            width: 120px;
            height: 120px;
            top: 5%;
            left: -40px;
        }

        .bubble.two {
            width: 80px;
            height: 80px;
            right: -20px;
            top: 25%;
            animation-delay: 1s;
        }

        .bubble.three {
            width: 150px;
            height: 150px;
            bottom: -50px;
            left: 15%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* Main */
        .container {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 30px 20px 25px;
        }

        /* Profile */
        .profile {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-pic {
            width: 105px;
            height: 105px;
            margin: auto;
            padding: 5px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 8px 25px rgba(73, 165, 205, 0.25);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .profile h1 {
            margin-top: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            color: #31779b;
        }

        .username {
            font-size: 13px;
            color: #6398b2;
            margin-top: 3px;
        }

        .bio {
            margin: 10px auto 0;
            max-width: 320px;
            font-size: 13px;
            line-height: 1.7;
            color: #5d8498;
        }

        /* Cute divider */
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 18px 0;
            color: #75bddd;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            width: 45px;
            height: 1px;
            background: rgba(70, 157, 195, 0.25);
        }

        /* Social cards */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.82);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            text-decoration: none;
            color: #416f87;
            box-shadow: 0 8px 20px rgba(66, 153, 193, 0.12);
            transition: all 0.25s ease;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 25px rgba(66, 153, 193, 0.2);
        }

        .icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            background: #d9f5ff;
        }

        .social-info {
            flex: 1;
        }

        .social-info strong {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            color: #397494;
        }

        .social-info span {
            font-size: 11px;
            color: #79a0b3;
        }

        .arrow {
            font-size: 20px;
            color: #78b9d5;
        }

        /* CTA */
        .contact {
            display: block;
            margin-top: 16px;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            background: #70c7eb;
            color: white;
            border-radius: 18px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            box-shadow: 0 8px 18px rgba(62, 159, 202, 0.25);
            transition: 0.25s;
        }

        .contact:hover {
            transform: translateY(-3px);
            background: #5bb9df;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: #6e9db2;
        }

        .heart {
            color: #76c8e9;
        }

        /* Desktop */
        @media (min-width: 700px) {
            .container {
                padding-top: 55px;
            }

            .profile-pic {
                width: 120px;
                height: 120px;
            }

            .profile h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="bubble one"></div>
    <div class="bubble two"></div>
    <div class="bubble three"></div>

    <main class="container">

        <!-- PROFILE -->
        <section class="profile">

            <div class="profile-pic">
                <img src="profile.jpg" alt="Profile">
            </div>

            <h1>Angelia Yurieski ✨</h1>

            <p class="username">@angeliiaa.__</p>

            <p class="bio">
                welcome to my little space 🩵<br>
                sharing moments, creativity & little things ✨
            </p>

        </section>

        <div class="divider">
            ♡
            <span>find me here</span>
            ♡
        </div>

        <!-- SOCIAL MEDIA -->
        <section class="links">

            <a href="https://instagram.com/angeliiaa.__" class="social-link" target="_blank">

                <div class="icon">
                    📸
                </div>

                <div class="social-info">
                    <strong>Instagram</strong>
                    <span>@angeliiaa.__</span>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a href="https://tiktok.com/@ttiramissuu._" class="social-link" target="_blank">

                <div class="icon">
                    🎵
                </div>

                <div class="social-info">
                    <strong>TikTok</strong>
                    <span>@ttiramissuu._</span>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>

        </section>

        <!-- CONTACT -->
        <a href="mailto:angeliayurieski33@gmail.com" class="contact">
            💌 Say Hello!
        </a>

        <footer>
            made with <span class="heart">♡</span> by Angelia
        </footer>

    </main>

</body>
</html>
